<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Trial</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b1a; --n1:#161a3a; --n2:#222b5c; --n3:#33438a; --n4:#4f69b5; --n5:#86a2dc; --n6:#c4d4f2;
  --cream:#fffaf0; --cream2:#efe2c0; --cream3:#d4bc8e; --gold0:#b5821a; --gold:#ffb612; --gold2:#ffe08a;
  --red0:#9a2430; --red:#d9483b; --steel:#a7abbe;
  --px:"Pixelify Sans",ui-monospace,monospace;
  /* one size unit for every overlay and the HUD: 11px in the phone embed, ~16px in the desktop embed, 24px at full screen */
  --s:clamp(11px,calc(min(100vw,160vh) * .0165),24px);
  --b:max(2px,calc(var(--s) * .14));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--px);font-size:var(--s);user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit}
/* fixed-width digits so the clock never jitters (Pixelify's 1 is narrow) */
.dg{white-space:nowrap}
.dg i{font-style:normal;display:inline-block;width:.62em;text-align:center}
.dg i.n{width:.3em}

/* boxes, keys, buttons */
.box{background:var(--n1);border:var(--b) solid var(--ink);box-shadow:inset 0 0 0 var(--b) var(--n2),calc(var(--b)*1.5) calc(var(--b)*1.5) 0 var(--ink)}
kbd{font-family:var(--px);font-weight:600;font-size:.82em;line-height:1;display:inline-block;min-width:1.7em;text-align:center;padding:.22em .35em .3em;background:var(--cream2);color:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--cream3)}
.btn{pointer-events:auto;cursor:pointer;font-weight:600;font-size:1em;line-height:1;padding:.55em .9em .6em;background:var(--n2);color:var(--cream);border:var(--b) solid var(--ink);box-shadow:inset var(--b) var(--b) 0 var(--n4),inset calc(var(--b)*-1) calc(var(--b)*-1) 0 var(--n1);display:inline-flex;align-items:center;justify-content:center;gap:.5em}
.btn:hover,.btn:focus-visible{background:var(--n3);outline:none}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--gold);color:var(--ink);box-shadow:inset var(--b) var(--b) 0 var(--gold2),inset calc(var(--b)*-1) calc(var(--b)*-1) 0 var(--gold0)}
.btn.go:hover,.btn.go:focus-visible{background:var(--gold2)}
.btn kbd{font-size:.7em}
.btn b{color:var(--gold);font-weight:600}

/* overlays: one centered card */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--s)*.8)}
.ov.dim{background:rgba(13,11,26,.62)}
.card{background:var(--n1);border:var(--b) solid var(--ink);box-shadow:inset 0 0 0 var(--b) var(--n3),calc(var(--b)*2.5) calc(var(--b)*2.5) 0 var(--ink);padding:1.1em 1.4em 1.2em;text-align:center;max-width:100%;max-height:100%;overflow:hidden}
.card h1,.card h2{margin:0;font-weight:700;line-height:1;color:var(--gold);text-shadow:calc(var(--b)*1.5) calc(var(--b)*1.5) 0 var(--ink)}
.card h1{font-size:2.6em}
.card h2{font-size:2em}
.card p{margin:.55em 0 0;color:var(--n6)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em 1.1em;margin-top:.9em;color:var(--n6);font-size:.9em}
.keys span{display:inline-flex;align-items:center;gap:.25em;white-space:nowrap}
.keys span>kbd+kbd{margin-left:-.05em}
#goBtn{margin-top:1em;font-size:1.25em;padding:.5em 1.6em .55em}
.best{margin-top:.8em;color:var(--steel)}
.best b,.res-best b{color:var(--cream);font-weight:600}
.menu{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:.5em;margin-top:.9em}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em;margin-top:.7em;padding-top:.7em;border-top:2px solid var(--n2)}
.opts .btn{font-size:.85em;padding:.45em .7em .5em;background:var(--n1);box-shadow:none;border-color:var(--n3)}
.opts .btn:hover,.opts .btn:focus-visible{background:var(--n2)}
#resBig{font-size:2.4em;font-weight:700;margin-top:.25em;line-height:1}
#resBig .tag{font-size:.36em;vertical-align:.5em}
.res-best{color:var(--steel);margin-top:.35em}
.tag{display:inline-block;font-size:.8em;font-weight:600;padding:.15em .45em .2em;background:var(--red);color:var(--cream);border:2px solid var(--ink);vertical-align:.1em;margin-left:.4em}
table{margin:.8em auto 0;border-collapse:collapse;font-size:.95em}
td{padding:.2em .6em;text-align:right;color:var(--n6)}
td:first-child{color:var(--steel);text-align:left}
tr.fast td{color:var(--gold)}
td.x{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
#msg{background:var(--ink)}
#msg h2{font-size:1.6em}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#tbox{position:absolute;left:calc(var(--s)*.7);top:calc(var(--s)*.7);padding:.4em .7em .5em;min-width:9em}
#lapTxt{color:var(--steel);font-size:.9em;font-weight:500}
#curTime{font-size:2em;font-weight:700;line-height:1.05;margin:.05em 0 .1em}
#curTime.out{color:var(--n4)}
#curTime.x{color:var(--red);text-decoration:line-through;text-decoration-thickness:calc(var(--b)*1.2)}
#tbox .sub{color:var(--steel);font-size:.9em}
#tbox .sub b{color:var(--cream);font-weight:500}
.chip{display:inline-block;font-weight:700;padding:.2em .55em .25em;border:var(--b) solid var(--ink);box-shadow:calc(var(--b)*1.5) calc(var(--b)*1.5) 0 var(--ink)}
#delta{position:absolute;left:50%;top:calc(var(--s)*.7);transform:translateX(-50%);font-size:1.35em}
#delta.fast{background:var(--gold);color:var(--ink)}
#delta.slow{background:var(--n3);color:var(--cream)}
#delta.sim::after{content:'SIM';font-size:.5em;margin-left:.45em;opacity:.75;vertical-align:.25em}
#warn{position:absolute;left:50%;top:calc(var(--s)*3.6);transform:translateX(-50%);background:var(--red);color:var(--cream);white-space:nowrap}
#lights{position:absolute;left:50%;top:calc(var(--s)*.7);transform:translateX(-50%);display:flex;gap:.45em;padding:.5em .6em}
#lights i{width:1.6em;height:1.6em;background:#2a0f1c;border:var(--b) solid var(--ink);position:relative}
#lights i.on{background:var(--red)}
#lights i.on::after{content:"";position:absolute;left:18%;top:18%;width:24%;height:24%;background:var(--cream)}
#map{position:absolute;left:calc(var(--s)*.7);bottom:calc(var(--s)*.7);padding:.35em;line-height:0}
#map canvas{width:6.2em;height:auto;image-rendering:pixelated;display:block}
#dash{position:absolute;right:calc(var(--s)*.7);bottom:calc(var(--s)*.7);padding:.35em .7em .45em;text-align:right;min-width:5.2em}
#spd{display:block;font-size:2.4em;font-weight:700;line-height:1}
#dash span{color:var(--steel);font-size:.85em}
#toast{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0}
#toastBig{font-size:2.6em;font-weight:700;line-height:1;text-shadow:calc(var(--b)*1.5) calc(var(--b)*1.5) 0 var(--ink)}
#toastSmall{margin-top:.45em;font-size:1em}
#toastSmall:empty{display:none}
#toastSmall.rec{background:var(--red);color:var(--cream)}
#toastSmall.x{background:var(--red);color:var(--cream)}
#toastSmall.n{background:var(--n2);color:var(--cream)}
/* gamepad: focus ring for menu navigation, and the wheel setup meter */
.btn.pf{background:var(--n3);outline:2px solid var(--gold);outline-offset:2px}
.btn.go.pf{background:var(--gold2)}
.meter{width:12em;max-width:100%;height:.7em;margin:.9em auto 0;background:var(--ink);border:2px solid var(--n3)}
.meter i{display:block;height:100%;width:0;background:var(--gold)}
#suStep{min-height:2.4em;max-width:26em;margin-left:auto;margin-right:auto}
#suCheck{margin-top:.8em;display:grid;gap:.45em;min-width:16em}
.chk{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:.6em;font-size:.85em;color:var(--n6);text-align:left}
.chk i{position:relative;display:block;height:.8em;background:var(--ink);border:2px solid var(--n3)}
.chk i b{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--gold)}
.chk i.ctr::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--n5)}
/* car picker */
.cars{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em;margin-top:.9em}
.cars .btn{flex-direction:column;align-items:stretch;gap:.3em;width:10.4em;padding:.45em .55em .55em;background:var(--n1);box-shadow:none;border-color:var(--n3);text-align:left}
.cars .cp{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:linear-gradient(#2a3a78,#d98a8a 70%,#3b4a2a 70%);image-rendering:auto;border:2px solid var(--ink)}
.cars .bars{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.18em .35em;font-size:.62em;font-weight:500;color:var(--n6)}
.cars .bars i{display:block;height:.55em;background:var(--ink);border:1px solid var(--n3)}
.cars .bars i b{display:block;height:100%;background:var(--gold)}
.cars .bars span:nth-child(3n){color:var(--cream);text-align:right;white-space:nowrap}
#title .card{overflow-y:auto}
@media (max-height:640px){#title .keys{display:none}#title p{display:none}}
.cars .btn:hover,.cars .btn:focus-visible{background:var(--n2)}
.cars .btn.sel{border-color:var(--gold);background:var(--n2);box-shadow:inset 0 0 0 2px var(--gold)}
.cars .cn{display:flex;justify-content:space-between;align-items:baseline;gap:.6em}
.cars .cn b{font-size:1.25em;color:var(--gold)}
.cars .cn i{font-style:normal;font-size:.75em;color:var(--steel)}
.cars .cs{font-size:.6em;font-weight:500;color:var(--steel);line-height:1.35}
.cars .cs em{font-style:normal;color:var(--steel)}
.cars .cb{font-size:.72em;color:var(--steel)}
.cars .cb b{color:var(--cream);font-weight:600}
.cars .cb i{font-style:normal;color:var(--red)}
.cnote{margin-top:.4em;font-size:.68em;color:var(--steel)}
.trks{display:flex;flex-wrap:wrap;justify-content:center;gap:.35em;margin-top:.7em}
.trks .btn{font-size:.78em;padding:.4em .6em .45em;background:var(--n1);box-shadow:none;border-color:var(--n3);flex-direction:column;gap:.15em}
.trks .btn:hover,.trks .btn:focus-visible{background:var(--n2)}
.trks .btn.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold);background:var(--n2)}
.trks .btn i{font-style:normal;font-size:.75em;font-weight:500;color:var(--steel)}

/* corner cluster: top right, same in every game */
#corner{position:fixed;right:calc(var(--s)*.7);top:calc(var(--s)*.7);display:flex;gap:calc(var(--s)*.5);z-index:5}
/* faded while driving, full strength on title, pause and results */
body.driving #corner{opacity:.35}
body.driving #corner:hover,body.driving #corner:focus-within{opacity:1}
.ib{pointer-events:auto;cursor:pointer;--ib:clamp(26px,calc(var(--s)*2.8),44px);width:var(--ib);height:var(--ib);padding:0;display:grid;place-items:center;background:var(--ink);color:var(--cream2);border:3px solid var(--cream2);box-shadow:3px 3px 0 var(--ink)}
.ib:hover,.ib:focus-visible{color:var(--gold);border-color:var(--gold);outline:none}
.ib svg{width:60%;height:60%;shape-rendering:crispEdges}
.ib.on{color:var(--gold)}

/* small frames (phone-sized embeds) */
@media (max-width:420px),(max-height:300px){
  #map{display:none}
  .card{padding:.7em .9em .8em}
  .card h1{font-size:2.1em}
  .keys{margin-top:.6em;gap:.35em .8em}
  #goBtn{margin-top:.7em}
  .best{margin-top:.55em}
  #results table{display:none}
  /* top center is taken by the timing box here, so the gap and lights drop below it */
  #delta{left:auto;right:calc(var(--s)*.7);top:calc(var(--s)*.7 + clamp(26px,calc(var(--s)*2.8),44px) + 10px);transform:none;font-size:1.15em}
  #lights{top:auto;bottom:calc(var(--s)*4.6)}
  #warn{top:auto;bottom:calc(var(--s)*4.6)}
}
@media (max-height:240px){
  .card h2{font-size:1.6em}
  .opts .btn{padding:.35em .55em .4em}
  .menu{margin-top:.6em;gap:.4em}
  .menu .btn{padding:.45em .7em .5em}
  .opts{margin-top:.5em;padding-top:.5em}
}
/* the smallest CRT (phone layout, ~250x190): keys and settings stay on their hotkeys */
@media (max-height:205px){
  .keys,.opts{display:none}
}
</style>

<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <div id="tbox" class="box">
    <div id="lapTxt">Out lap</div>
    <div id="curTime" class="dg out"></div>
    <div class="sub">Best <b id="bestTxt" class="dg"></b></div>
  </div>
  <div id="delta" class="chip dg hidden"></div>
  <div id="lights" class="box hidden"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="warn" class="chip" style="opacity:0">Lap invalid</div>
  <div id="map" class="box"><canvas id="mapC" width="64" height="72"></canvas></div>
  <div id="dash" class="box"><b id="spd" class="dg">0</b><span>km/h</span></div>
  <div id="toast"><div id="toastBig" class="dg"></div><div id="toastSmall" class="chip"></div></div>
</div>

<div id="title" class="ov"><div class="card">
  <h1>Time Trial</h1>
  <p>Three laps. Beat your best one.</p>
  <div class="cars" id="carPick" role="radiogroup" aria-label="Car"></div>
  <div class="trks" id="trackPick" role="radiogroup" aria-label="Track"></div>
  <div class="keys">
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> Drive</span>
    <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Car</span>
    <span><kbd>L</kbd> Line</span>
    <span><kbd>R</kbd> Restart</span>
    <span><kbd>Esc</kbd> Pause</span>
    <span id="padHint" class="hidden"><kbd>RT</kbd><kbd>LT</kbd> Drive <kbd>LB</kbd><kbd>RB</kbd> Car <kbd>X</kbd> Line <kbd>Y</kbd> Camera <kbd>Start</kbd> Pause</span>
  </div>
  <button class="btn go" id="goBtn">Start</button>
  <div class="opts hidden" id="tPadRow"><button class="btn" id="tPad">Wheel setup</button></div>
  <div class="best">Best <b id="tBest" class="dg"></b></div>
</div></div>

<div id="pause" class="ov dim hidden"><div class="card">
  <h2>Paused</h2>
  <div class="menu">
    <button class="btn go" id="pResume">Resume <kbd>Esc</kbd></button>
    <button class="btn" id="pRestart">Restart <kbd>R</kbd></button>
    <button class="btn" id="pQuit">Quit</button>
  </div>
  <div class="opts">
    <button class="btn" id="oGhost">Ghost <b>On</b></button>
    <button class="btn" id="oCam">Camera <b>Near</b></button>
    <button class="btn" id="oAssist">Assists <b>On</b></button>
    <button class="btn" id="oLine">Line <b>On</b></button>
    <button class="btn hidden" id="oPad">Wheel setup</button>
  </div>
</div></div>

<div id="setup" class="ov dim hidden"><div class="card">
  <h2>Wheel setup</h2>
  <p id="suStep"></p>
  <div class="meter" id="suMeterBox"><i id="suMeter"></i></div>
  <div id="suCheck" class="hidden">
    <div class="chk"><span>Steering</span><i class="ctr"><b id="ckSteer"></b></i></div>
    <div class="chk"><span>Throttle</span><i><b id="ckThr"></b></i></div>
    <div class="chk"><span>Brake</span><i><b id="ckBrk"></b></i></div>
    <label class="chk"><span>Rotation</span><span><input id="suRot" type="number" min="90" max="2520" step="10" style="width:5em"> ° lock to lock <small id="suRotHint"></small></span></label>
    <div class="chk" id="ffbRow"><span>Force</span><span><button class="btn" id="ffbBtn">Connect force feedback</button> <input id="ffbGain" type="range" min="0" max="100" step="5" style="width:6em" aria-label="Force feedback strength"> <label><input id="ffbInv" type="checkbox"> invert</label> <small id="ffbMsg"></small></span></div>
  </div>
  <div class="menu">
    <button class="btn go hidden" id="suDone">Done</button>
    <button class="btn hidden" id="suRedo">Redo setup</button>
    <button class="btn hidden" id="suSkip">Skip</button>
    <button class="btn" id="suDefault">Use defaults</button>
    <button class="btn" id="suCancel">Cancel <kbd>Esc</kbd></button>
  </div>
</div></div>

<div id="results" class="ov dim hidden"><div class="card">
  <h2 id="resHead">Finished</h2>
  <div id="resBig" class="dg"></div>
  <div class="res-best" id="resSub"></div>
  <table id="resTable"></table>
  <div class="menu">
    <button class="btn go" id="rAgain">Again <kbd>Enter</kbd></button>
    <button class="btn" id="rMenu">Title</button>
  </div>
</div></div>

<div id="msg" class="ov hidden"><div class="card">
  <h2 id="msgHead">Time Trial</h2>
  <p id="msgBody">Needs a keyboard. Open it on a computer.</p>
</div></div>

<div id="corner">
  <button class="ib" id="bMute" title="Sound (M)" aria-label="Sound off" aria-pressed="false"></button>
  <button class="ib" id="bFull" title="Full screen (F)" aria-label="Full screen"></button>
</div>

<script type="module">
import * as THREE from 'three';
import { TRACKS as REAL_TRACKS } from './tracks.js';

/* ---------------------------------------------------------------- utilities */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function fmt(t) { if (t == null || !isFinite(t)) return '-:--.---'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); }
function fmtS(t) { return t == null ? '--.---' : t.toFixed(3); }
function fmtD(d) { return (d < 0 ? '−' : '+') + Math.abs(d).toFixed(3); }
// write a number string as fixed-width cells; skips the DOM write when nothing changed
function dg(el, str) {
  if (typeof el === 'string') el = $(el);
  if (el._v === str) return; el._v = str;
  let h = ''; for (const ch of str) h += (ch === ':' || ch === '.') ? '<i class="n">' + ch + '</i>' : '<i>' + ch + '</i>';
  el.innerHTML = h;
}
let rngSeed = 117;
const rnd = () => { rngSeed = (rngSeed * 16807) % 2147483647; return (rngSeed - 1) / 2147483646; };

/* touch-only guard */
const touchOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

/* ---------------------------------------------------------------- storage */
const KEY = 'nl-racing-ampere-v1';
// records are per car (and per physics version: laps from the old generic car don't carry over)
const STORE_KEY = id => 'nl-racing-feb-v1:' + (prefs.track && prefs.track !== 'ridge' ? prefs.track + ':' : '') + id;
const freshStore = () => ({ bestLap: null, bestSec: [null, null, null], ghost: null, tel: null, laps: 0 });
let store = freshStore();
function loadStore(id) { store = freshStore(); try { const raw = localStorage.getItem(STORE_KEY(id)); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {} return store; }
function save() { try { localStorage.setItem(STORE_KEY(VP.id), JSON.stringify(store)); } catch (e) {} }
let prefs = { assist: true, ghost: true, cam: 0, car: 'sn3', track: 'ridge', line: true, wheelRot: 900, ffbGain: 60, ffbInv: false };
try { const p = localStorage.getItem(KEY + '-prefs'); if (p) prefs = Object.assign(prefs, JSON.parse(p)); } catch (e) {}
function savePrefs() { try { localStorage.setItem(KEY + '-prefs', JSON.stringify(prefs)); } catch (e) {} }

/* ---------------------------------------------------------------- cars */
/* The three Formula Electric at Berkeley cars: SN3 (2023-24, Michigan 2024 #271), SN4 (2024-25, Michigan 2025
   #257), SN5 (2025-26, Michigan 2026 #100). Physical data comes from each car's FSAE Design Spec Sheet (see the
   CARS table). Still estimates, because no FEB source has them: yaw inertia (FEB's own sims use 75 kg m^2),
   wheel inertia, driveline efficiency, the LSD lock ratios at the DSS ramp angles, SN4's aero balance. */
/* Liveries, from team photos (matched to the DSS car numbers): SN3 #271 (navy with a gold edge stripe, carbon top,
   gold Cal bear, "Berkeley", front and rear wings), SN4 #257 (glossy navy-black nose with gold edge stripes over a
   white pinstripe, gold front-wing flaps, black rear wing with gold endplate stripes), SN5 #100 (glossy blue nose
   with gold chevrons, gold side panel, "UC Berkeley", gold-topped wings). Painted onto the shared livery layout

/* ---- Force feedback (WebHID, Chrome/Edge) ----
   Wheels like the MOZA R3 are standard USB HID "PID" force-feedback devices, so the page can drive them directly:
   create one constant-force effect, start it, then stream its magnitude. Report layouts differ per device, so
   they're read from the device's own descriptor (WebHID collections), never hard-coded. The torque is the front
   tyres' self-aligning moment (lateral force x (pneumatic + mechanical trail)) through the steering ratio, so the
   wheel goes light as the fronts pass their peak slip, plus a little damping. Rotation range and overall
   strength still come from the wheel's own software (Pit House for MOZA). */

const hasU = (r, id) => r.items.some(it => itemUsages(it).includes(pidU(id)));
// pack a report from {usage id: value}; array items take the usage id to select (e.g. effect type, operation)
function packReport(r, vals) {
  const bits = r.items.reduce((n, it) => n + it.reportSize * it.reportCount, 0), buf = new Uint8Array(Math.ceil(bits / 8)); let pos = 0;
  const put = (v, size) => { v = Math.round(v); if (v < 0) v += 2 ** size; for (let b = 0; b < size; b++, pos++) if ((v >> b) & 1) buf[pos >> 3] |= 1 << (pos & 7); };
  for (const it of r.items) {
    const us = itemUsages(it);
    for (let k = 0; k < it.reportCount; k++) {
      let v = 0;
      if (it.isArray) { const want = us.findIndex(u => vals[u & 0xffff] === true && (u >> 16) === PID); v = want >= 0 ? it.logicalMinimum + want : 0; }
      else {
        const u = us[Math.min(k, us.length - 1)], pg = u >> 16;
        let x = pg === PID ? vals[u & 0xffff] : undefined;
        if (pg === 0x01 && (u & 0xffff) === 0x30) x = 1;                                    // axes enable: steering (X)
        if (pg === 0x0A) x = it.logicalMaximum >= 35999 ? 9000 : Math.round(it.logicalMaximum / 4);   // direction: 90 deg
        v = x === undefined ? 0 : x === true ? 1 : clamp(x, it.logicalMinimum, it.logicalMaximum);

    }
  }

}
async function ffbConnect() {

      effect: outs.find(x => hasU(x, 0x50)), constant: outs.find(x => hasU(x, 0x70) && !hasU(x, 0x72)), op: outs.find(x => hasU(x, 0x78) || hasU(x, 0x7C)),
      ctrl: outs.find(x => hasU(x, 0x97) || hasU(x, 0x9A)), gain: outs.find(x => hasU(x, 0x7E)), create: feats.find(x => hasU(x, 0x25)), load: feats.find(x => hasU(x, 0x8B) || hasU(x, 0x8C))

// steering-wheel torque from the tyres, as a share of what the base can give (-1..1)
function ffbTorque() {
  const c = car; let mz = 0;
  for (let i = 0; i < 2; i++) { const a = Math.abs(c.alp[i]), tp = 0.025 * Math.max(-0.2, 1 - a / (PEAK.a * 1.3)); mz += c.Ft[i] * (tp + 0.015); }   // pneumatic trail fades past peak; ~15 mm mechanical trail (DSS)

  // parked (SN5 DSS: 10 deg KPI, 33 mm scrub, 6 deg caster -> roughly 6 mm of effective lever)
  const jack = -(c.Fz[0] + c.Fz[1]) * 0.006 * Math.sin(c.delta);

}

}
