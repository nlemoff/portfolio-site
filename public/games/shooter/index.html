<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ringfall</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b1a;--n0:#161a3a;--n1:#222b5c;--n2:#33438a;--n3:#4f69b5;--n4:#86a2dc;--n5:#c4d4f2;
  --c0:#fffaf0;--c1:#efe2c0;--c2:#d4bc8e;--g0:#b5821a;--g1:#ffb612;--g2:#ffe08a;--r0:#9a2430;--r1:#d9483b;--steel:#a7abbe;
  --fs:clamp(11px,min(3.6vh,2.4vw),26px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;color:var(--c1);font-family:"Pixelify Sans",ui-monospace,monospace;font-size:var(--fs);line-height:1.2;font-variant-ligatures:none;-webkit-user-select:none;user-select:none}
#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;display:block}
body.freelook #c{cursor:none}
.hidden{display:none!important}
/* overlays */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:.6em}
.ov.dim{background:rgba(13,11,26,.6)}
.card{background:var(--n0);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--n2),4px 4px 0 var(--ink);padding:.8em 1.2em .9em;text-align:center;max-width:100%;max-height:100%;overflow:auto}
h1,h2{margin:0;font-weight:700;line-height:1;color:var(--g1);text-shadow:.08em .08em 0 var(--ink)}
h1{font-size:2.7em;letter-spacing:.02em}
h2{font-size:1.9em}
h2.bad{color:var(--r1)}
.line{margin:.35em 0 .7em;color:var(--c1)}
.ctl{display:grid;grid-template-columns:auto auto;gap:.3em .7em;justify-content:center;align-items:center;margin:0 auto .8em;text-align:left}
.ctl dt{text-align:right;white-space:nowrap}
.ctl dd{margin:0;color:var(--n5)}
kbd{display:inline-block;min-width:1.5em;padding:.05em .3em;margin-left:.15em;font:inherit;font-size:.85em;line-height:1.25;text-align:center;color:var(--ink);background:var(--c1);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:1.15em;line-height:1;cursor:pointer;color:var(--ink);background:var(--g1);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:.4em 1.1em;margin:.15em .2em}
.btn:hover,.btn:focus-visible{background:var(--g2);outline:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--n2);color:var(--c0)}
.btn.alt:hover,.btn.alt:focus-visible{background:var(--n3)}
.best{margin-top:.6em;color:var(--c2)}
.best:empty{display:none}
.best b{color:var(--c0);font-weight:600}
.note{color:var(--c1);margin:.2em 0 .2em}
.stats{display:grid;grid-template-columns:auto auto;gap:.25em 1em;justify-content:center;margin:.6em auto .8em;font-size:1.1em}
.stats span:nth-child(odd){color:var(--n4);text-align:right}
.stats span:nth-child(even){color:var(--c0);text-align:left}
.rec{display:inline-block;margin-left:.4em;padding:0 .3em;background:var(--r1);color:var(--c0);border:2px solid var(--ink);font-size:.8em}
.sens{display:flex;align-items:center;justify-content:center;gap:.6em;margin:.8em 0 0;color:var(--n5)}
input[type=range]{-webkit-appearance:none;appearance:none;width:8em;height:.7em;background:var(--ink);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--n2);margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:.8em;height:1.3em;background:var(--g1);border:2px solid var(--ink);border-radius:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:.8em;height:1.3em;background:var(--g1);border:2px solid var(--ink);border-radius:0;cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--g2)}
#sensV{min-width:2.4em;text-align:left;color:var(--c0)}
/* corner cluster */
#tb{position:absolute;top:.5em;right:.5em;display:flex;gap:.35em;z-index:5}
body.playing #tb{display:none}
.ib{width:2em;height:2em;padding:0;display:grid;place-items:center;cursor:pointer;background:var(--n1);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);color:var(--c1)}
.ib:hover,.ib:focus-visible{background:var(--n2);outline:none}
.ib:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.ib svg{width:1.25em;height:1.25em;display:block;shape-rendering:crispEdges}
.ib[aria-pressed="true"]{color:var(--g1)}
.ib .on,.ib[aria-pressed="true"] .off{display:none}
.ib[aria-pressed="true"] .on{display:inline}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;font-weight:600;color:var(--c0);text-shadow:.08em .08em 0 var(--ink)}
#hud .tl{position:absolute;left:.6em;top:.45em;display:flex;align-items:center;gap:.5em;font-size:1.25em}
#hud .bl{position:absolute;left:.6em;bottom:.5em;display:flex;align-items:flex-end;gap:.55em}
#hud .br{position:absolute;right:.6em;bottom:.5em;text-align:right}
#radar{width:4.6em;height:4.6em;image-rendering:pixelated;display:block;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--n2)}
.vit{display:flex;flex-direction:column;gap:.25em}
.shbar{display:flex;gap:2px;padding:2px;background:var(--ink)}
.shbar i{display:block;width:.55em;height:.55em;background:var(--n1)}
.shbar i.f{background:var(--n4)}
.shbar i.o{background:var(--g2)}
.shbar.out i{background:var(--r0)}
.hp{font-size:2.1em;line-height:.9;display:flex;align-items:center;gap:.15em}
.hp svg{width:.5em;height:.5em;margin-right:.1em;shape-rendering:crispEdges}
.hp.low{color:var(--r1)}
.wn{font-size:1.1em;color:var(--c1)}
.am{font-size:2.1em;line-height:.9}
.am.out{color:var(--r1)}
.heat{display:inline-block;width:5em;height:.7em;margin:.35em 0 .2em;background:var(--ink);border:2px solid var(--ink)}
.heat i{display:block;height:100%;background:var(--g1)}
.heat.hot i{background:var(--r1)}
.nd{display:flex;gap:.25em;justify-content:flex-end;margin-top:.3em}
.nd i{display:block;width:.55em;height:.55em;background:var(--n1);border:2px solid var(--ink)}
.nd i.f{background:var(--g1)}
.key{display:inline-block;width:.7em;height:.7em;background:var(--g1);border:2px solid var(--ink);transform:rotate(45deg);box-shadow:none}
#msgs{position:absolute;left:0;right:0;top:2.6em;text-align:center;font-size:1.05em}
#msgs div{margin-bottom:.15em}
#msgs .g{color:var(--g1)}#msgs .r{color:var(--r1)}#msgs .b{color:var(--n5)}
#clk{position:absolute;left:0;right:0;top:62%;text-align:center;color:var(--c0)}
@media (max-height:300px){
  #tb{flex-direction:column}
  h1{font-size:2.2em}.card{padding:.55em .9em .6em}.line{margin:.2em 0 .45em}.ctl{gap:.2em .5em;margin-bottom:.5em}.ctl .x{display:none}.best{margin-top:.35em}
}
@media (max-height:210px),(max-width:300px){
  .ctl{display:none}h1{font-size:2em}.line{margin:.25em 0 .6em}
}
</style>
</head>
<body>
<canvas id="c" width="320" height="200"></canvas>
<div id="hud" class="hidden">
  <div class="tl"><span id="hTime">00:00</span><span id="hKey" class="key hidden" title="Keystone"></span></div>
  <div id="msgs"></div>
  <div id="clk" class="hidden">Click to look</div>
  <div class="bl">
    <canvas id="radar" width="31" height="31"></canvas>
    <div class="vit">
      <div class="shbar" id="hSh"></div>
      <div class="hp" id="hHp"><svg viewBox="0 0 9 9" aria-hidden="true"><path fill="#0d0b1a" d="M0 0h9v9H0z"/><path fill="#efe2c0" d="M1 1h7v7H1z"/><path fill="#d9483b" d="M4 2h1v2h2v1H5v2H4V5H2V4h2z"/></svg><span>100</span></div>
    </div>
  </div>
  <div class="br">
    <div class="wn" id="hWn">Rifle</div>
    <div class="am" id="hAm">96</div>
    <div class="heat hidden" id="hHeat"><i></i></div>
    <div class="nd" id="hNd"></div>
  </div>
</div>
<div class="ov" id="ovTitle">
  <div class="card">
    <h1>Ringfall</h1>
    <div class="line">Find the keystone, then reach the beacon.</div>
    <div id="touchMsg" class="note hidden">Needs a keyboard and mouse.</div>
    <div id="startBox">
      <dl class="ctl">
        <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>Move</dd>
        <dt><kbd>Mouse</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd></dt><dd>Look</dd>
        <dt><kbd>Click</kbd><kbd>Space</kbd></dt><dd>Fire</dd>
        <dt class="x"><kbd>G</kbd></dt><dd class="x">Grenade</dd>
        <dt class="x"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></dt><dd class="x">Weapons</dd>
      </dl>
      <button class="btn" id="playBtn">Start</button>
      <div class="best" id="bestTitle"></div>
    </div>
  </div>
</div>
<div class="ov dim hidden" id="ovPause">
  <div class="card">
    <h2>Paused</h2>
    <div style="margin-top:.7em">
      <button class="btn" id="resumeBtn">Resume</button><button class="btn alt" id="restartBtn">Restart</button>
    </div>
    <label class="sens">Look speed <input type="range" id="sens" min="0.4" max="3" step="0.05" value="1"><span id="sensV">1.00</span></label>
  </div>
</div>
<div class="ov dim hidden" id="ovEnd">
  <div class="card">
    <h2 id="endTitle">Cleared</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">Play again</button>
  </div>
</div>
<div id="tb">
  <button class="ib" id="sndBtn" aria-pressed="false" aria-label="Sound" title="Sound (M)"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 4h2l3-3h1v10H6L3 8H1z"/><path class="off" fill="currentColor" d="M8 4h1v1h1V4h1v1h-1v1h1v1h1v1h-1V7h-1v1H9V7H8V6h1V5H8z"/><path class="on" fill="currentColor" d="M8 5h1v2H8zM10 3h1v6h-1z"/></svg></button>
  <button class="ib" id="fsBtn" aria-pressed="false" aria-label="Full screen" title="Full screen (F)"><svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M1 1h4v2H3v2H1zM7 1h4v4H9V3H7zM1 7h2v2h2v2H1zM9 7h2v4H7V9h2z"/></svg></button>
</div>
<script>
'use strict';
(()=>{
// ===================================================================
// utilities
// ===================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const RGB=(r,g,b)=>((255<<24)|((b&255)<<16)|((g&255)<<8)|(r&255))>>>0;
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967295;}
function pnoise(x,y,p,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const x0=((xi%p)+p)%p,y0=((yi%p)+p)%p,x1=(x0+1)%p,y1=(y0+1)%p;
  return lerp(lerp(hash2(x0,y0,s),hash2(x1,y0,s),u),lerp(hash2(x0,y1,s),hash2(x1,y1,s),u),v);}
function pfbm(x,y,p,s,o){let t=0,a=.5,n=0,f=1;for(let i=0;i<o;i++){t+=a*pnoise(x*f,y*f,p*f,s+i*31);n+=a;a*=.5;f*=2;}return t/n;}
function noise1(x,s){return pnoise(x,0.5,100000,s);}
let LS=null;try{LS=window.localStorage;}catch(e){LS=null;}
function lsGet(k,d){try{const v=LS&&LS.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{LS&&LS.setItem(k,JSON.stringify(v));}catch(e){}}

// ===================================================================
// canvas / buffer
// ===================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let RH=200,RW=320,PLANE=.75,PROJ=213,PXS=1,needDraw=true,rafId=0,last=0,lastDraw=0;
let IMG,PX,ZB,SKYCOL;
// Pick an integer device-pixel scale so the low-res buffer maps to whole screen pixels (crisp at any size).
function resize(){
  const dpr=window.devicePixelRatio||1,vw=innerWidth||640,vh=innerHeight||400;
  const dw=Math.round(vw*dpr),dh=Math.round(vh*dpr);
  const s=Math.max(1,Math.round(dh/205));
  RH=Math.max(100,Math.floor(dh/s));
  RW=Math.min(Math.floor(dw/s),Math.floor(RH*2.4));RW-=RW&1;
  cv.width=RW;cv.height=RH;PXS=s;
  cv.style.width=(RW*s/dpr)+'px';cv.style.height=(RH*s/dpr)+'px';
  cv.style.left=(Math.floor((dw-RW*s)/2)/dpr)+'px';cv.style.top=(Math.floor((dh-RH*s)/2)/dpr)+'px';
  ctx.imageSmoothingEnabled=false;
  IMG=ctx.createImageData(RW,RH);PX=new Uint32Array(IMG.data.buffer);ZB=new Float32Array(RW);SKYCOL=new Int32Array(RW);
  PLANE=clamp(.62*(RW/RH)/1.333,.6,.95);PROJ=(RW/2)/PLANE;
  needDraw=true;kick();if(typeof syncFS==='function')syncFS();
}
addEventListener('resize',resize);resize();

// ===================================================================
// textures (64x64, procedural)
// ===================================================================
const TS=64;
function makeTex(fn){const d=new Uint32Array(TS*TS),e=new Uint8Array(TS*TS);
  for(let v=0;v<TS;v++)for(let u=0;u<TS;u++){const c=fn(u,v);d[v*TS+u]=RGB(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255));e[v*TS+u]=c[3]?1:0;}
  return {d,e};}
const mul=(c,k)=>[c[0]*k,c[1]*k,c[2]*k,c[3]];
// tiny bitmap font (3x5) - also used for textures and HUD
const FONT={};
(()=>{const src={
'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001011001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
':':'000010000010000','.':'000000000000010',',':'000000000010100','/':'001001010100100','-':'000000111000000','+':'000010111010000','!':'010010010000010','?':'110001010000010',"'":'010010000000000','%':'101001010100101','(':'010100100100010',')':'010001001001010',' ':'000000000000000','x':'000101010101000','#':'101111101111101','>':'100010001010100','<':'001010100010001','*':'000101010101000'};
for(const k in src){FONT[k]=src[k].split('').map(Number);}})();

const T={};
T.metal=makeTex((u,v)=>{
  const n=pfbm(u/16,v/16,4,11,3);let b=70+n*34;let c=[b*.86,b*.97,b*1.08,0];
  const lu=u%32;
  if(lu===0||v===0||v===40)c=mul(c,.45);
  else if(lu===1||v===1||v===41)c=mul(c,1.3);
  else if(lu===31||v===63||v===39)c=mul(c,.7);
  if(v>6&&v<34){const ix=lu-6,iy=v-8,jx=26-lu,jy=32-v;
    if(ix>=0&&jx>=0&&iy>=0&&jy>=0&&ix+iy>=4&&jx+iy>=4&&ix+jy>=4&&jx+jy>=4){c=mul(c,.82);if(iy===0||ix+iy===4||jx+iy===4)c=mul(c,.7);if(jy===0)c=mul(c,1.25);}}
  if(v>=44&&v<=47&&lu>=4&&lu<=27){const k=v===45||v===46?1:.55;c=[60*k+20,210*k+20,255*k,1];}
  if(v>=50&&v<62&&u%4===0)c=mul(c,.72);
  return c;});
T.secret=makeTex((u,v)=>{const c=T.metal.d[v*TS+u];let r=c&255,g=(c>>8)&255,b=(c>>16)&255;
  const lu=u%32;if(v>=44&&v<=47&&lu>=4&&lu<=27){const k=v===45||v===46?1:.55;return [250*k,190*k,60*k,1];}return [r,g,b,T.metal.e[v*TS+u]];});
T.stone=makeTex((u,v)=>{
  const n=pfbm(u/10.7,v/10.7,6,23,4);const b=112+n*56;let c=[b*.93,b*.96,b,0];
  const bu=(u+(v<32?0:16))%32,bv=v%32;
  if(bv===0||bu===0)c=mul(c,.5);else if(bv===1||bu===1)c=mul(c,1.18);
  const g1=Math.abs(Math.abs(bu-16)-(bv-6));
  if(bv>=7&&bv<=18&&g1<1)c=[70,215,205,1];
  else if(bv>=7&&bv<=18&&g1<2)c=mul(c,.6);
  if(bv===23&&bu>=9&&bu<=23)c=[60,190,185,1];
  if(pfbm(u/8,v/8,8,91,2)>.68)c=mul(c,.8);
  return c;});
T.glow=makeTex((u,v)=>{
  const n=pfbm(u/16,v/16,4,5,2);let c=[30+n*14,36+n*14,46+n*16,0];
  if(u<4||u>59){c=[96+n*30,108+n*30,120+n*30,0];if(u===0||u===63)c=mul(c,.5);}
  const k=1-Math.abs(u-31.5)/9;
  if(k>0&&v%16>1){c=[40+150*k*k,150+105*k,200+55*k,k>.25?1:0];}
  if(v%16<=1)c=mul(c,.6);
  return c;});
T.gold=makeTex((u,v)=>{
  const n=pfbm(u/16,v/16,4,77,3);
  const band=v%32;let c;
  if(band<11)c=[22+n*14,22+n*14,26+n*14,0];
  else if(band<13||band>27)c=[40+n*10,40+n*10,44,0];
  else c=[218+n*30,166+n*30,36+n*20,0];
  if(u%32===0)c=mul(c,.55);
  return c;});
T.door=makeTex((u,v)=>{
  if(u<4||u>59||v<3||v>60){const k=(u===0||u===63||v===0||v===63)?.5:1;return [70*k,82*k,94*k,0];}
  let c=[10,26,40,0];
  if(v%8<2)c=[60,200,250,1];
  if(u===31||u===32)c=[210,250,255,1];
  if(Math.abs(u-31.5)<12&&Math.abs(v-32)<2)c=[120,235,255,1];
  return c;});
T.keydoor=makeTex((u,v)=>{
  if(u<4||u>59||v<3||v>60){const k=(u===0||u===63||v===0||v===63)?.5:1;return [94*k,82*k,60*k,0];}
  let c=[34,22,8,0];
  if(v%8<2)c=[200,140,40,1];
  const dd=Math.abs(u-31.5)+Math.abs(v-31.5);
  if(dd<14&&dd>10)c=[255,215,110,1];
  if(dd<6)c=[255,240,190,1];
  return c;});
T.plaque=makeTex((u,v)=>{
  const c=T.metal.d[v*TS+u];let out=[c&255,(c>>8)&255,(c>>16)&255,T.metal.e[v*TS+u]];
  if(u>=12&&u<52&&v>=14&&v<34){const n=pfbm(u/8,v/8,8,3,2);out=[150+n*40,120+n*30,60+n*20,0];if(u===12||v===14)out=mul(out,1.25);if(u===51||v===33)out=mul(out,.6);}
  const s='1701';for(let i=0;i<4;i++){const gl=FONT[s[i]];const ox=17+i*8,oy=19;const gx=((u-ox)/2)|0,gy=((v-oy)/2)|0;
    if(u>=ox&&v>=oy&&gx<3&&gy<5&&gl[gy*3+gx])out=[40,30,18,0];}
  return out;});
T.floor=makeTex((u,v)=>{
  const n=pfbm(u/16,v/16,4,41,3);let b=46+n*24;let c=[b*.92,b,b*1.12,0];
  const tu=u%16,tv=v%16;
  if(tu===0||tv===0)c=mul(c,.55);else if(tu===1||tv===1)c=mul(c,1.2);
  if(((u>>4)+(v>>4))%2===0&&tu>5&&tu<11&&tv>5&&tv<11)c=mul(c,1.15);
  if((u%32===15||u%32===16)&&(v%32===15||v%32===16))c=[90,230,255,1];

// sky panorama (the ring rises over the horizon)
// ===================================================================
const SKYW=1024,SKYH=120;
const SKY=new Uint32Array(SKYW*SKYH);
(()=>{
  const stops=[[0,[8,14,38]],[.45,[24,62,104]],[.78,[70,136,160]],[1,[160,204,206]]];
  function grad(t){for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const a=stops[i-1],b=stops[i],k=(t-a[0])/(b[0]-a[0]);return [lerp(a[1][0],b[1][0],k),lerp(a[1][1],b[1][1],k),lerp(a[1][2],b[1][2],k)];}}return stops[stops.length-1][1];}
  const TILT=1.0,TH0=1.1;
  for(let x=0;x<SKYW;x++){
    const th=x/SKYW*TAU;
    const s=Math.sin(th-TH0);
    const el=s>0?Math.atan(Math.tan(TILT)*s):-1;
    const rc=SKYH-10-(el/TILT)*(SKYH-44);
    const thick=s>0?3+10*(1-el/TILT):0;
    // ridge (seamless)
    const rn=pfbm(Math.cos(th)*2+4,Math.sin(th)*2+4,1000,13,4);
    const ridge=4+rn*18;
    for(let y=0;y<SKYH;y++){
      const t=y/(SKYH-1);let c=grad(t);
      if(t<.55&&hash2(x,y,3)>.994){const k=(1-t/.55)*(150+hash2(x,y,4)*105);c=[c[0]+k,c[1]+k,c[2]+k];}
      // gas giant
      const pdx=(x-640)/1.0,pdy=y-34,pd=Math.hypot(pdx,pdy);
      if(pd<19){const nz=Math.sqrt(1-(pd/19)**2);const l=clamp((-pdx*.6-pdy*.3)/19+nz*.6,0,1);
        const band=Math.sin(pdy*.55+pnoise(pdx*.2,pdy*.4,1000,8)*2.5);
        const base=band>0?[226,170,112]:[178,108,74];c=[base[0]*(.18+l*.95),base[1]*(.18+l*.9),base[2]*(.2+l*.85)];}
      else if(pd<21){c=[c[0]+30,c[1]+40,c[2]+48];}
      // ring
      if(s>0&&Math.abs(y-rc)<thick){
        const vv=(y-rc)/thick;
        let rcI;
        if(Math.abs(vv)>.72)rcI=[170,182,196];
        else{const ln=pnoise(th*60,vv*2.2,100000,21);const cl=pnoise(th*140+3,vv*4,100000,22);
          rcI=ln>.55?[72,128,78]:[44,92,150];if(ln>.7)rcI=[118,140,92];if(cl>.66)rcI=[226,236,240];}
        const fade=clamp(el/TILT,0,1)*.35;
        c=[lerp(rcI[0],c[0],fade),lerp(rcI[1],c[1],fade),lerp(rcI[2],c[2],fade)];
        if(Math.abs(Math.abs(vv)-.72)<.12)c=[c[0]*.6,c[1]*.6,c[2]*.6];
      }
      // mountains + spires
      const fromBottom=SKYH-1-y;
      if(fromBottom<ridge){const k=fromBottom/ridge;c=[lerp(92,46,k),lerp(128,80,k),lerp(140,98,k)];}
      const sp=[[90,34,3],[300,22,2],[470,40,3],[860,28,2],[960,18,2]];
      for(const q of sp){const dx=Math.abs(x-q[0]);const top=q[1]+dx*3;if(dx<=q[2]&&fromBottom<top+0&&fromBottom<q[1]+0){c=[40,72,92];if(dx===0&&fromBottom>q[1]-3)c=[150,250,255];}}
      SKY[y*SKYW+x]=RGB(clamp(c[0]|0,0,255),clamp(c[1]|0,0,255),clamp(c[2]|0,0,255));
    }
  }
})();

function blockedCell(cx,cy){if(cx<0||cy<0||cx>=MW||cy>=MH)return true;const i=cy*MW+cx;if(WALL[i])return true;const di=DOORI[i];return di>=0&&DOORS[di].open<.85;}
function blockedCircle(x,y,r){return blockedCell(Math.floor(x-r),Math.floor(y-r))||blockedCell(Math.floor(x+r),Math.floor(y-r))||blockedCell(Math.floor(x-r),Math.floor(y+r))||blockedCell(Math.floor(x+r),Math.floor(y+r));}
function moveEnt(e,dx,dy,r){let moved=false;
  const n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/.2)||1;dx/=n;dy/=n;
  for(let k=0;k<n;k++){if(!blockedCircle(e.x+dx,e.y,r)){e.x+=dx;moved=true;}if(!blockedCircle(e.x,e.y+dy,r)){e.y+=dy;moved=true;}}
  for(const d of DECOR){const ox=e.x-d.x,oy=e.y-d.y,dd=Math.hypot(ox,oy),m=r+d.r;if(dd<m&&dd>1e-4){const px=e.x+ox/dd*(m-dd),py=e.y+oy/dd*(m-dd);if(!blockedCircle(px,py,r)){e.x=px;e.y=py;}}}
  return moved;}
function solidRay(x,y){const cx=x|0,cy=y|0;if(cx<0||cy<0||cx>=MW||cy>=MH)return true;const i=cy*MW+cx;if(WALL[i])return true;const di=DOORI[i];return di>=0&&DOORS[di].open<.6;}
function los(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy),n=Math.ceil(d/.15);for(let i=1;i<n;i++){const t=i/n;if(solidRay(ax+dx*t,ay+dy*t))return false;}return true;}
const HIT={d:0,side:0,tex:1,wx:0,last:0};
function cast(ox,oy,rdx,rdy){
  let mx=ox|0,my=oy|0;const ddx=rdx===0?1e30:Math.abs(1/rdx),ddy=rdy===0?1e30:Math.abs(1/rdy);
  let sx,sy,sdx,sdy;
  if(rdx<0){sx=-1;sdx=(ox-mx)*ddx;}else{sx=1;sdx=(mx+1-ox)*ddx;}
  if(rdy<0){sy=-1;sdy=(oy-my)*ddy;}else{sy=1;sdy=(my+1-oy)*ddy;}
  let last=my*MW+mx;
  for(let i=0;i<100;i++){
    let side;if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}
    if(mx<0||my<0||mx>=MW||my>=MH){HIT.d=side?sdy-ddy:sdx-ddx;HIT.side=side;HIT.tex=1;HIT.wx=0;HIT.last=last;return HIT;}
    const ci=my*MW+mx,di=DOORI[ci];
    if(di>=0){const dr=DOORS[di];
      if(dr.axis===side){const dd=side===0?sdx-ddx*.5:sdy-ddy*.5;const p=side===0?oy+dd*rdy:ox+dd*rdx;const cc=side===0?my:mx;
        if(Math.floor(p)===cc){const fr=p-cc;if(fr>=dr.open){HIT.d=dd;HIT.side=side;HIT.tex=dr.tex;HIT.wx=fr-dr.open;HIT.last=last;return HIT;}}}
      last=ci;continue;}
    const w=WALL[ci];
    if(w){const d=side===0?sdx-ddx:sdy-ddy;HIT.d=d;HIT.side=side;HIT.tex=w;const wx=side===0?oy+d*rdy:ox+d*rdx;HIT.wx=wx-Math.floor(wx);HIT.last=last;
      if(side===0&&rdx>0)HIT.wx=1-HIT.wx;if(side===1&&rdy<0)HIT.wx=1-HIT.wx;return HIT;}
    last=ci;
  }
  HIT.d=1e9;return HIT;
}

    if(p.pl&&p.ch){let best=null,bs=.7;for(const e of ENEMIES){if(e.dead)continue;const ex=e.x-p.x,ey=e.y-p.y,d=Math.hypot(ex,ey);if(d>14)continue;const sp=Math.hypot(p.vx,p.vy);const c=(ex*p.vx+ey*p.vy)/(d*sp);const ang=Math.acos(clamp(c,-1,1));if(ang<bs){bs=ang;best=e;}}
      if(best){const sp=Math.hypot(p.vx,p.vy);const cur=Math.atan2(p.vy,p.vx),tg=Math.atan2(best.y-p.y,best.x-p.x);let df=tg-cur;df=Math.atan2(Math.sin(df),Math.cos(df));const na=cur+clamp(df,-3*dt,3*dt);p.vx=Math.cos(na)*sp;p.vy=Math.sin(na)*sp;}}

      if(solidRay(p.x,p.y)){dead=true;break;}
      if(p.pl){for(const e of ENEMIES){if(e.dead)continue;if(Math.hypot(e.x-p.x,e.y-p.y)<e.hr+p.r){damageEnemy(e,p.dmg,p.ch?'charged':'plasma',p.vx/14,p.vy/14,p.ch?3:.5);spark(p.x,p.y,p.z,BLOOD[e.type],5,1.6,.4);dead=true;break;}}}

  }
  // grenades
  for(let i=NADES.length-1;i>=0;i--){const g=NADES[i];g.fuse-=dt;g.vz-=12*dt;

function takePickup(t){

    case 'a':if(P.ammo>=288)return false;P.ammo=Math.min(288,P.ammo+40);msg('Rifle ammo +40');S.pickup();return true;
    case 'c':if(P.shells>=48)return false;P.shells=Math.min(48,P.shells+10);msg('Shells +10');S.pickup();return true;

function useKey(){

function drawSprite(s,cam,ca,sa,plx,ply,invDet,hor,light){

  else if(P.w===1){im=VM.pistol;ox=-im.w/2+30;oy=-im.h+14;mx=43;my=10;}
  else{im=VM.shotgun;ox=-im.w/2+22;oy=-im.h+14;mx=53;my=9;}
  let x=ox+bx+jx,y=oy+by+sw*70+dip+kick*(P.w===2?16:9)+jy+(pumpT>0&&pumpT<.45?Math.sin((pumpT/.45)*Math.PI)*8:0);

  if(P.w===1){const ch=P.charge,heatK=P.heat/100;
    ctx.globalCompositeOperation='lighter';
    if(ch>0){const r=(2+ch*7+(ch>=1?Math.sin(gt*40)*1.5:0))*k;ctx.fillStyle=`rgba(120,255,100,${.35+ch*.4})`;ctx.beginPath();ctx.arc(X(x+mx),Y(y+my),r,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(X(x+mx),Y(y+my),r*.4,0,TAU);ctx.fill();}
    if(P.overheat>0||heatK>.6){ctx.fillStyle=`rgba(255,${P.overheat>0?120:200},60,${P.overheat>0?.5+Math.sin(gt*30)*.2:(heatK-.6)})`;ctx.fillRect(X(x+26),Y(y+34),S(34),S(8));}
    ctx.globalCompositeOperation='source-over';}

function hud(){
  const W=RW,H=RH,cx=W>>1,cy=H>>1;
  // screen tints
  if(redF>0){ctx.globalAlpha=Math.min(.5,redF*.45);ctx.fillStyle='#d9483b';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(P.hp<35&&!P.dead){ctx.globalAlpha=(.55+Math.sin(gt*5)*.2)*(1-P.hp/35);ctx.drawImage(VIGN,0,0,W,H);ctx.globalAlpha=1;}
  if(shF>0){ctx.globalAlpha=shF;ctx.fillStyle=P.os>0?'#ffe08a':'#86a2dc';ctx.fillRect(0,0,W,2);ctx.fillRect(0,H-2,W,2);ctx.fillRect(0,0,2,H);ctx.fillRect(W-2,0,2,H);ctx.globalAlpha=shF*.15;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(pickF>0){ctx.globalAlpha=pickF*.12;ctx.fillStyle='#ffe08a';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(P.dead){ctx.globalAlpha=Math.min(.6,P.deadT*.5);ctx.fillStyle='#4a0f18';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;domHud();return;}
  // hurt direction
  const hr=Math.round(H*.17);
  for(const h of HURT){const rel=h.a-P.a;ctx.globalAlpha=Math.min(1,h.t);ctx.fillStyle='#d9483b';for(let i=-5;i<=5;i++){const a=rel+i*.06;ctx.fillRect(Math.round(cx+Math.sin(a+Math.PI/2)*hr)-1,Math.round(cy-Math.cos(a+Math.PI/2)*hr)-1,2,2);}ctx.globalAlpha=1;}
  // crosshair
  const cs=H>=240?2:1;
  ctx.fillStyle=aimEnemy?'#d9483b':'#fffaf0';
  const dot=(x,y)=>ctx.fillRect(cx+x*cs,cy+y*cs,cs,cs);
  if(P.w===0){for(let i=3;i<=5;i++){dot(-i,0);dot(i,0);dot(0,-i);dot(0,i);}dot(0,0);}
  else if(P.w===1){for(let i=0;i<4;i++){dot(-4+i,-i);dot(4-i,-i);dot(-4+i,i);dot(4-i,i);}
    if(P.charge>0){ctx.fillStyle='#ffb612';const n=Math.round(P.charge*12);for(let i=0;i<n;i++){const a=i/12*TAU-Math.PI/2;dot(Math.round(Math.cos(a)*8),Math.round(Math.sin(a)*8));}}}
  else{for(let i=0;i<12;i++){const a=i/12*TAU;dot(Math.round(Math.cos(a)*8),Math.round(Math.sin(a)*8));}dot(0,0);}
  if(hitT>0){ctx.fillStyle=killT>0?'#d9483b':'#ffe08a';const r=killT>0?8:6;for(let i=3;i<=r;i++){dot(-i,-i);dot(i,-i);dot(-i,i);dot(i,i);}}
  domHud();
}
// DOM HUD: only touched when a value changes
const HV={};
function setT(el,k,v){if(HV[k]!==v){HV[k]=v;el.textContent=v;}}
function setC(el,k,cls,on){const key=k+cls;if(HV[key]!==on){HV[key]=on;el.classList.toggle(cls,on);}}
const fmtT=t=>{const m=(t/60|0),s=t%60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0');};
let hudEls=null;
function domHud(){
  if(!hudEls){const g=id=>document.getElementById(id);hudEls={time:g('hTime'),key:g('hKey'),sh:g('hSh'),hp:g('hHp'),hpN:g('hHp').querySelector('span'),wn:g('hWn'),am:g('hAm'),heat:g('hHeat'),heatI:g('hHeat').firstElementChild,nd:g('hNd'),clk:g('clk'),radar:g('radar')};
    hudEls.sh.innerHTML='<i></i>'.repeat(10);hudEls.nd.innerHTML='<i></i>'.repeat(4);hudEls.rg=hudEls.radar.getContext('2d');}
  const E=hudEls;
  setT(E.time,'t',String(runT/60|0).padStart(2,'0')+':'+String(runT%60|0).padStart(2,'0'));
  setC(E.key,'k','hidden',!P.key);
  const shs=Math.ceil(P.sh/10),os=Math.ceil(P.os/10),sk=shs+'/'+os+'/'+(P.recharging?(gt*10|0)%10:-1);
  if(HV.sh!==sk){HV.sh=sk;const kids=E.sh.children;for(let i=0;i<10;i++){kids[i].className=i<os?'o':(i<shs&&!(P.recharging&&i===shs-1&&(gt*10|0)&1))?'f':'';}}
  setC(E.sh,'s','out',P.sh<=0&&((gt*4|0)&1)===1);
  setT(E.hpN,'hp',String(Math.ceil(P.hp)));setC(E.hp,'hp','low',P.hp<35);
  setT(E.wn,'wn',['Rifle','Plasma','Shotgun'][P.w]);
  const isP=P.w===1;setC(E.am,'a','hidden',isP);setC(E.heat,'h','hidden',!isP);
  if(isP){const hk=Math.round(P.heat);if(HV.heat!==hk){HV.heat=hk;E.heatI.style.width=hk+'%';}setC(E.heat,'h','hot',P.overheat>0||P.heat>70);}
  else{const n=P.w===0?P.ammo:P.shells;setT(E.am,'am',String(n));setC(E.am,'a','out',n<=0);}
  if(HV.nd!==P.nades){HV.nd=P.nades;[...E.nd.children].forEach((c,i)=>c.className=i<P.nades?'f':'');}
  setC(E.clk,'c','hidden',!(!locked&&lockedOnce&&!lockFailed&&state==='playing'));
  // motion tracker
  const g=E.rg,R=15;g.fillStyle='rgba(13,11,26,.72)';g.fillRect(0,0,31,31);
  g.fillStyle='#222b5c';g.fillRect(15,0,1,31);g.fillRect(0,15,31,1);
  const pr=((gt*.8)%1)*R|0;g.fillStyle='#33438a';g.fillRect(15-pr,15-pr,pr*2+1,1);g.fillRect(15-pr,15+pr,pr*2+1,1);g.fillRect(15-pr,15-pr,1,pr*2+1);g.fillRect(15+pr,15-pr,1,pr*2+1);
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  for(const e of ENEMIES){if(e.dead)continue;const rx=e.x-P.x,ry=e.y-P.y;const fw=rx*ca+ry*sa,rt=-rx*sa+ry*ca;if(Math.abs(fw)>15||Math.abs(rt)>15)continue;
    if(!e.moving&&!e.awake&&Math.hypot(fw,rt)>4)continue;const z=e.type===2?3:2;g.fillStyle=e.type===2?'#ffb612':'#d9483b';g.fillRect(Math.round(15+rt)-(z>>1),Math.round(15-fw)-(z>>1),z,z);}
  g.fillStyle='#fffaf0';g.fillRect(15,14,1,2);
}
function showMsgs(){
  const el=document.getElementById('msgs');const key=MSGS.map(m=>m.t+(m.life>.4?1:0)).join('|');if(HV.msgs===key)return;HV.msgs=key;
  el.innerHTML='';for(const m of MSGS){const d=document.createElement('div');d.textContent=m.t;d.className=m.c||'';if(m.life<.4)d.style.opacity='.5';el.appendChild(d);}
}

// ===================================================================
// main loop
// ===================================================================
let onScreen=true;
// The loop only runs while something moves: play, or the title's attract camera while the CRT is on screen.
// Pause/results draw one frozen frame and stop the loop entirely.
function kick(){if(!rafId){last=performance.now();rafId=requestAnimationFrame(frame);}}
function frame(now){
  rafId=0;
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  update(dt);
  const live=state==='playing'||(state==='title'&&onScreen&&!document.hidden);
  if(live&&!rafId)rafId=requestAnimationFrame(frame);
  if(!live&&!needDraw)return;
  if(state==='title'&&!needDraw&&now-lastDraw<33)return; // attract mode at ~30fps
  needDraw=false;lastDraw=now;
  if(state==='title'){CAM.x=13.5+Math.cos(gt*.12)*5.5;CAM.y=17.5+Math.sin(gt*.12)*4;CAM.a=gt*.12+Math.PI*.9;CAM.hy=0;}
  else{const sk=shake*shake;CAM.x=P.x;CAM.y=P.y;CAM.a=P.a+(Math.random()-.5)*sk*.06;
    const bobA=Math.min(1,P.spd/4.4);CAM.hy=(Math.sin(P.bob*2)*1.6*bobA+(Math.random()-.5)*sk*10+(P.dead?Math.min(40,P.deadT*60):0)-vmKick*vmKick*1.5)*RH/200;}
  render(CAM);
  ctx.putImageData(IMG,0,0);
  if(state!=='title'){drawVM();hud();showMsgs();}
}
try{new IntersectionObserver(es=>{onScreen=es[es.length-1].isIntersecting;if(onScreen)kick();}).observe(document.documentElement);}catch(e){}

// ===================================================================
// UI / input
// ===================================================================
const $=id=>document.getElementById(id);
const ovTitle=$('ovTitle'),ovPause=$('ovPause'),ovEnd=$('ovEnd');
function show(el){[ovTitle,ovPause,ovEnd].forEach(o=>o.classList.toggle('hidden',o!==el));document.body.classList.toggle('playing',!el);document.body.classList.toggle('freelook',!el&&lockFailed&&!locked);$('hud').classList.toggle('hidden',state==='title');needDraw=true;kick();}
function freeLook(){return state==='playing'&&!locked&&lockFailed;}
function setFree(on){lockFailed=on;document.body.classList.toggle('freelook',freeLook());
  if(freeLook()&&!freeHint){freeHint=true;msg('Hold the cursor at an edge to keep turning');}}
function lockPointer(){
  clearTimeout(lockTimer);
  // anything other than a lock within 400ms (refusal, error, no API) falls back to free look
  lockTimer=setTimeout(()=>{if(state==='playing'&&!locked)setFree(true);},400);
  try{if(!cv.requestPointerLock){setFree(true);return;}const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{if(!locked)setFree(true);});}catch(e){setFree(true);}
}
function releaseKeys(){for(const k in K)K[k]=false;mouseL=false;}
function startGame(){aInitIfOn();newGame();state='playing';show(null);ignoreMouseUntil=performance.now()+250;lockPointer();S.ambStart();last=performance.now();}
function pause(){if(state!=='playing')return;state='paused';releaseKeys();S.chargeStop();P.charge=0;P.chargeT=0;if(document.pointerLockElement)try{document.exitPointerLock();}catch(e){}show(ovPause);setTimeout(()=>$('resumeBtn').focus({preventScroll:true}),0);}
function resume(){if(state!=='paused')return;state='playing';show(null);ignoreMouseUntil=performance.now()+250;lockPointer();last=performance.now();}
function endGame(won){
  state=won?'won':'dead';S.chargeStop();releaseKeys();
  if(document.pointerLockElement)try{document.exitPointerLock();}catch(e){}
  const best=lsGet('ringfall.best',null);let rec=false;
  if(won){S.win();if(!best||!(best.time<=runT)){rec=true;lsSet('ringfall.best',{time:runT,kills:P.kills,total});}}
  const t=$('endTitle');t.textContent=won?'Cleared':'You died';t.classList.toggle('bad',!won);
  const rows=[];
  if(won)rows.push(['Time',fmtT(runT)+(rec&&best?'<span class="rec">New best</span>':'')]);
  rows.push(['Kills',P.kills+' / '+total]);
  if(P.secret)rows.push(['Secret','Found']);
  const b=lsGet('ringfall.best',null);if(b&&!rec)rows.push(['Best',fmtT(b.time)]);
  $('endStats').innerHTML=rows.map(r=>'<span>'+r[0]+'</span><span>'+r[1]+'</span>').join('');
  show(ovEnd);updateBest();S.ambStop();setTimeout(()=>$('againBtn').focus({preventScroll:true}),0);
}
function updateBest(){const b=lsGet('ringfall.best',null);$('bestTitle').innerHTML=b&&b.time>0?('Best <b>'+fmtT(b.time)+'</b>'):'';}
updateBest();
function aInitIfOn(){if(A.on){aInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();}}
function setSound(on){A.on=on;$('sndBtn').setAttribute('aria-pressed',String(on));$('sndBtn').setAttribute('aria-label',on?'Sound on':'Sound off');
  if(on){aInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});if(state==='playing')S.ambStart();S.pickup();}else{S.ambStop();S.chargeStop();}}
$('sndBtn').addEventListener('click',e=>{setSound(!A.on);e.currentTarget.blur();});
// full screen: our own document, or the house page's full screen of this iframe
function parentFS(){try{const pd=window.parent!==window&&window.parent.document;return !!(pd&&pd.fullscreenElement&&pd.fullscreenElement===window.frameElement);}catch(e){return false;}}
function isFS(){return !!(document.fullscreenElement||document.webkitFullscreenElement)||parentFS();}
function syncFS(){const b=document.getElementById('fsBtn');if(!b)return;const on=isFS();b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Exit full screen':'Full screen');}
function toggleFS(){try{
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else if(parentFS()){window.parent.document.exitFullscreen();}
  else{const el=document.documentElement;const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(()=>{});}
}catch(e){}}
$('fsBtn').addEventListener('click',e=>{toggleFS();e.currentTarget.blur();});
document.addEventListener('fullscreenchange',()=>{syncFS();setTimeout(resize,50);});
$('playBtn').addEventListener('click',startGame);
$('resumeBtn').addEventListener('click',resume);
$('restartBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
const sensEl=$('sens');sensEl.value=sens;$('sensV').textContent=(+sens).toFixed(2);
sensEl.addEventListener('input',()=>{sens=+sensEl.value;$('sensV').textContent=sens.toFixed(2);lsSet('ringfall.sens',sens);});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;if(locked){lockedOnce=true;clearTimeout(lockTimer);setFree(false);}else if(state==='playing'&&lockedOnce)pause();});
document.addEventListener('pointerlockerror',()=>{locked=false;if(state==='playing')setFree(true);});
cv.addEventListener('mousedown',e=>{
  if(state!=='playing')return;
  if(!locked&&lockedOnce&&!lockFailed){lockPointer();return;}
  if(e.button===0)mouseL=true;else if(e.button===2){throwNade();}
});

cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{
  if(!locked){overCv=e.target===cv;if(overCv){const r=cv.getBoundingClientRect();mouseNX=clamp(((e.clientX-r.left)/r.width)*2-1,-1,1);}}
  if(state!=='playing'||P.dead)return;

  const mx=clamp(e.movementX||0,-250,250);P.a+=mx*.0022*sens;});
document.addEventListener('mouseleave',()=>{overCv=false;});
// wheel: one weapon step per notch (trackpads send bursts), never scroll the house page while playing
let wheelAcc=0,wheelT=0;
addEventListener('wheel',e=>{if(state!=='playing')return;e.preventDefault();const now=performance.now();if(now-wheelT>250)wheelAcc=0;wheelAcc+=e.deltaY;
  if(Math.abs(wheelAcc)>=40&&now-wheelT>140){cycle(wheelAcc>0?1:-1);wheelAcc=0;wheelT=now;}},{passive:false});
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];let kseq=[];
addEventListener('keydown',e=>{
  const tag=e.target&&e.target.tagName;
  // arrows/space must not scroll the house page; leave Space/arrows to a focused button or slider
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown'].includes(e.code)&&!(state!=='playing'&&(tag==='BUTTON'||tag==='INPUT')))e.preventDefault();

  kseq.push(e.code);if(kseq.length>10)kseq.shift();if(kseq.join()===KONAMI.join()&&!party){party=true;if(state==='playing'&&P)spark(P.x+Math.cos(P.a)*1.5,P.y+Math.sin(P.a)*1.5,.6,[255,220,60],20,2,1.2,3,.05);S.party({v:.6,pan:0});}

  if(e.code==='KeyM')setSound(!A.on);
  else if(e.code==='KeyF')toggleFS();
  if(state==='title'&&e.code==='Enter'&&tag!=='BUTTON'&&$('touchMsg').classList.contains('hidden'))startGame();
  else if(state==='paused'&&(e.code==='Escape'||e.code==='KeyP'))resume();

    if(e.code==='Escape'||e.code==='KeyP'){pause();return;}

  }
});
addEventListener('keyup',e=>{K[e.code]=false;});
addEventListener('blur',()=>{releaseKeys();pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else kick();});
// the house page asks the game to pause when the CRT scrolls out of view
addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='nl:pause')pause();});
// touch-only devices
const touchOnly=matchMedia('(pointer: coarse)').matches&&!matchMedia('(any-pointer: fine)').matches;
if(touchOnly){$('touchMsg').classList.remove('hidden');$('startBox').classList.add('hidden');}
syncFS();

kick();
window.__rf={get P(){return P;},get state(){return state;},get E(){return ENEMIES;},get D(){return DOORS;},get K2(){return PICKUPS;},get runT(){return runT;},los,hitscan,cast,start:startGame,K,tp(x,y,a){P.x=x;P.y=y;if(a!=null)P.a=a;},give(){P.key=true;P.has[2]=true;P.shells=40;}};
})();
